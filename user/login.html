<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Apna Job Dekho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="mb-4">
          <a href="../index.html" class="brand">
            <img class="brand-logo" src="https://github.com/rajankumaryadav920-arch/apnajobdekho/blob/main/WhatsApp_Image_2026-10-12_at_1.10.16_PM-removebg-preview%20(1).png?raw=true" alt="Apna Job Dekho" />
            
          </a>
        </div>
        <h2>Welcome back</h2>
        <p class="subtext">Sign in to continue your career journey.</p>
        <form id="login-form">
          <div class="field-group">
            <label for="role">Login as</label>
            <select id="role" name="role" class="form-select">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" />
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div id="demo-credentials" class="mt-3"></div>
        <div class="d-grid gap-2 mt-3">
          <a href="../admin/index.html" class="btn btn-outline-primary">Open Admin Page</a>
          <a href="dashboard.html" class="btn btn-outline-secondary">Open User Dashboard</a>
        </div>
        <div class="mt-3 text-center">
          <a href="register.html" class="inline-link">Need an account? Create one</a>
        </div>
      </div>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
