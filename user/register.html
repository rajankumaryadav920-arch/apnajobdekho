<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Apna Job Dekho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="mb-4">
          <a href="../index.html" class="brand">
            <img class="brand-logo" src="https://github.com/rajankumaryadav920-arch/apnajobdekho/blob/main/WhatsApp_Image_2026-10-12_at_1.10.16_PM-removebg-preview%20(1).png?raw=true" alt="Apna Job Dekho" />
            
          </a>
        </div>
        <h2>Create your account</h2>
        <p class="subtext">Start building your future with a profile designed for students and freshers.</p>
        <form id="register-form">
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <div class="field-group">
                <label for="firstName">First name <span class="text-danger">(required)</span></label>
                <input type="text" id="firstName" name="firstName" class="form-control" placeholder="First name" autocomplete="given-name" required />
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="field-group">
                <label for="middleName">Middle name <span class="text-muted">(optional)</span></label>
                <input type="text" id="middleName" name="middleName" class="form-control" placeholder="Middle name" autocomplete="additional-name" />
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="field-group">
                <label for="lastName">Last name <span class="text-danger">(required)</span></label>
                <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Last name" autocomplete="family-name" required />
              </div>
            </div>
          </div>
          <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" />
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <div class="mt-3 text-center">
          <a href="login.html" class="inline-link">Already registered? Login</a>
        </div>
      </div>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
